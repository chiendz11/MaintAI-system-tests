[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --strict-markers
markers =
    e2e: End-to-end system and business flow tests
    monitoring: Prometheus metrics scrape and Alertmanager tests
    chaos: Resilience, failure injection, and recovery tests
    slow: Long-running load, drift, or catch-up tests
